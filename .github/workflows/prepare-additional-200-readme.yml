name: Prepare additional 200-paper README update

on:
  push:
    branches:
      - docs/additional-200-2026-09-17-v3

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/additional-200-2026-09-17-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate the reviewed README block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          addition = Path('.maintenance/additional-200-2026-09-17/README_ADDITION.md').read_text(encoding='utf-8').strip()
          start = '<!-- BEGIN ADDITIONAL-200-2026-09-16 -->'
          if start in text:
              raise SystemExit('Additional-200 block already exists; refusing repeat application.')
          end_recent = '<!-- END GENERATED RECENT PAPERS -->'
          if end_recent in text:
              pos = text.index(end_recent) + len(end_recent)
              text = text[:pos] + '\n\n---\n\n' + addition + '\n' + text[pos:]
          elif '## Resource collection' in text:
              pos = text.index('## Resource collection')
              text = text[:pos] + addition + '\n\n---\n\n' + text[pos:]
          else:
              raise SystemExit('Could not find a safe README insertion point.')
          text = text.replace(
              '<a href="#recent-literature"><img src="https://img.shields.io/badge/Recent%20papers-81-2563EB?style=flat-square" alt="81 recent papers"></a>',
              '<a href="#recent-literature"><img src="https://img.shields.io/badge/Recent%20register-81-2563EB?style=flat-square" alt="81-paper recent register"></a>\n  <a href="#additional-200-papers"><img src="https://img.shields.io/badge/Additional%20papers-200-7C3AED?style=flat-square" alt="200 additional papers"></a>'
          )
          required = [
              'paper/Cons_01.png', 'paper/Eval_01.png', 'paper/Optimize_01.png',
              'https://doi.org/10.20944/preprints202606.0870.v1',
              'https://visitor-badge.laobi.icu/badge?page_id=Shawn-CodeDev.Awesome-Consistency-Diffusion-Visual-Generation',
              start,
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Preservation check failed: {missing}')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate existing resource and recent-paper checks
        run: |
          python scripts/check_resource_table.py
          python scripts/validate_recent_papers.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
      - name: Commit generated README only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm -r .maintenance/additional-200-2026-09-17 .github/workflows/prepare-additional-200-readme.yml
          git commit -m 'docs: add 200-paper literature expansion to README'
          git push origin HEAD:refs/heads/docs/additional-200-2026-09-17-v3
