name: Apply README additional 200

on:
  push:
    branches: [readme-update]
    paths:
      - .github/workflows/apply-readme-additional-200.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readme-update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update README safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- BEGIN ADDITIONAL-200-2026-09-16 -->'

          required = [
              'paper/Cons_01.png',
              'paper/Eval_01.png',
              'paper/Optimize_01.png',
              'visitor-badge.laobi.icu',
              'img.shields.io/github/stars',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Refusing README update; expected existing content missing: {missing}')
          if not Path('docs/additional-papers-200.md').is_file():
              raise SystemExit('docs/additional-papers-200.md is missing')

          if marker not in text:
              nav_old = '  <a href="#recent-literature">Recent papers</a> ·\n  <a href="#resource-collection">Resources</a> ·'
              nav_new = '  <a href="#recent-literature">Recent papers</a> ·\n  <a href="#additional-200-papers">Additional 200</a> ·\n  <a href="#resource-collection">Resources</a> ·'
              if nav_old not in text:
                  raise SystemExit('README navigation anchor not found; refusing broad rewrite')
              text = text.replace(nav_old, nav_new, 1)

              badge_old = '  <a href="#recent-literature"><img src="https://img.shields.io/badge/Recent%20papers-81-2563EB?style=flat-square" alt="81 recent papers"></a>'
              badge_new = badge_old + '\n  <a href="#additional-200-papers"><img src="https://img.shields.io/badge/Additional%20papers-200-7C3AED?style=flat-square" alt="200 additional papers"></a>'
              if badge_old not in text:
                  raise SystemExit('README recent-paper badge not found')
              text = text.replace(badge_old, badge_new, 1)

              block = r'''
<!-- BEGIN ADDITIONAL-200-2026-09-16 -->
<a id="additional-200-papers"></a>
## Additional literature · 200 papers

<p align="center">
  <a href="docs/additional-papers-200.md"><img src="https://img.shields.io/badge/Additional%20papers-200-7C3AED?style=flat-square" alt="200 additional papers"></a>
  <img src="https://img.shields.io/badge/External-79-4C78A8?style=flat-square" alt="79 external-consistency papers">
  <img src="https://img.shields.io/badge/Internal-64-59A14F?style=flat-square" alt="64 internal-consistency papers">
  <img src="https://img.shields.io/badge/Normative-57-E15759?style=flat-square" alt="57 normative-consistency papers">
</p>

A second literature pass adds **200 further papers** relevant to consistency in diffusion-based visual generation. This batch is kept separate from the earlier 81-paper dated register so that provenance and counting remain explicit rather than presenting the two research passes as one homogeneous benchmark.

| Primary relation | Papers | Main coverage |
|:--|--:|:--|
| **External consistency** | **79** | Compositional prompting, structural control, image/video editing, visual text, virtual try-on, and editing evaluation |
| **Internal consistency** | **64** | Identity preservation, multi-view geometry, temporal coherence, multi-shot storytelling, and persistent scene memory |
| **Normative consistency** | **57** | Preference and reward learning, concept erasure and retention, safety, fairness, and physical plausibility |

**[Browse the complete 200-paper catalog →](docs/additional-papers-200.md)**

The catalog is split into smaller pages for faster GitHub rendering and easier review:
[Part 1](docs/additional-papers-200/part-01.md) ·
[Part 2](docs/additional-papers-200/part-02.md) ·
[Part 3](docs/additional-papers-200/part-03.md) ·
[Part 4](docs/additional-papers-200/part-04.md) ·
[Part 5](docs/additional-papers-200/part-05.md) ·
[Part 6](docs/additional-papers-200/part-06.md) ·
[Part 7](docs/additional-papers-200/part-07.md) ·
[Part 8](docs/additional-papers-200/part-08.md).

> **Counting note.** The earlier dated register contains 81 papers and this second pass contains 200 papers. The historical resource collection below mixes papers, benchmarks, datasets, evaluators, and topic placeholders; therefore its resource count should not be arithmetically combined with 81 + 200 as a deduplicated publication total.

<!-- END ADDITIONAL-200-2026-09-16 -->
'''.strip('\n')

              anchor = '\n## Resource collection\n'
              if anchor not in text:
                  raise SystemExit('Resource collection heading not found')
              text = text.replace(anchor, '\n\n---\n\n' + block + '\n\n---\n\n## Resource collection\n', 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -q 'additional-200-papers' README.md
          grep -q 'docs/additional-papers-200.md' README.md
          grep -q 'paper/Cons_01.png' README.md
          grep -q 'paper/Eval_01.png' README.md
          grep -q 'paper/Optimize_01.png' README.md
      - name: Validate existing resource files
        run: |
          python scripts/check_resource_table.py
          if [ -f scripts/validate_recent_papers.py ]; then python scripts/validate_recent_papers.py; fi
      - name: Commit README and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm .github/workflows/apply-readme-additional-200.yml
          git commit -m 'docs: expose the additional 200-paper catalog in README'
          git push origin HEAD:refs/heads/readme-update
