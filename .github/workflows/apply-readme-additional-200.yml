name: Apply README additional 200

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-readme-additional-200.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update README safely
        run: |
          python .github/scripts/update_readme_additional_200.py
          git diff --check
          grep -q 'additional-200-papers' README.md
          grep -q 'docs/additional-papers-200.md' README.md
          python scripts/check_resource_table.py
          if [ -f scripts/validate_recent_papers.py ]; then python scripts/validate_recent_papers.py; fi
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit README and remove temporary updater
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm .github/scripts/update_readme_additional_200.py .github/workflows/apply-readme-additional-200.yml
          git commit -m 'docs: expose the additional 200-paper catalog in README'
          git push origin HEAD:main
